<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Slide Left In & Slide Right Out</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef7f7;
      padding: 50px 20px;
      margin: 0;
    }

    .block {
      max-width: 700px;
      margin: 100px auto;
      padding: 20px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      opacity: 0;
      transform: translateX(0);
      transition: transform 0.8s ease, opacity 0.8s ease;
    }

    .slide-in-left {
      opacity: 1;
      transform: translateX(0);
    }

    .slide-out-right {
      opacity: 0;
      transform: translateX(100px);
    }
  </style>
</head>
<body>

  <div class="block"> 
    <h2>Block 1</h2>
    <p>Scroll down: slides in from left<br>Scroll up: slides out to right</p>
  </div>

  <div class="block"> 
    <h2>Block 2</h2>
    <p>Test it by scrolling down and up!</p>
  </div>

  <div class="block"> 
    <h2>Block 3</h2>
    <p>Each block reacts to scroll direction.</p>
  </div>

  <script>
    let lastScrollTop = window.scrollY;

    function handleScroll() {
      const blocks = document.querySelectorAll('.block');
      const windowHeight = window.innerHeight;
      const currentScrollTop = window.scrollY;
      const scrollingDown = currentScrollTop > lastScrollTop;

      blocks.forEach(block => {
        const rect = block.getBoundingClientRect();
        const isVisible = rect.top < windowHeight && rect.bottom > 0;

        if (isVisible) {
          if (scrollingDown) {
            block.classList.add('slide-in-left');
            block.classList.remove('slide-out-right');
          } else {
            block.classList.remove('slide-in-left');
            block.classList.add('slide-out-right');
          }
        }
      });

      lastScrollTop = currentScrollTop <= 0 ? 0 : currentScrollTop;
    }

    window.addEventListener('scroll', handleScroll);
    window.addEventListener('load', handleScroll);
  </script>

</body>
</html>
